name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.10"   # LTS
          - "1"      # latest stable
          - "nightly"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        exclude:
          - os: macos-latest
            version: nightly
          - os: windows-latest
            version: nightly
    steps:
      - uses: actions/checkout@v4
      # ExactWKB is developed against ClusterAlgebras.jl `main`, not its registered
      # version, so CI checks out the core alongside and develops it by path. The
      # registered v0.1.1 predates API these tests call. Resurgence.jl is on the
      # registry at a version that satisfies `[compat]`, so it resolves normally.
      - uses: actions/checkout@v4
        with:
          repository: benedikt-nagler/ClusterAlgebras.jl
          path: ClusterAlgebras.jl
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Develop ExactWKB and the unreleased core into the test environment
        run: |
          julia -e '
            using Pkg
            Pkg.activate("test")
            Pkg.develop([PackageSpec(path = "ClusterAlgebras.jl"),
                         PackageSpec(path = ".")])'
        shell: bash
      - uses: julia-actions/julia-buildpkg@v1
      # Run the test environment prepared above directly, rather than via
      # `julia-actions/julia-runtest` (`Pkg.test()`), which re-resolves the test
      # environment and would lose the by-path entry for ExactWKB itself.
      - name: Run tests
        run: julia --project=test --code-coverage=user test/runtests.jl
        shell: bash
        continue-on-error: ${{ matrix.version == 'nightly' }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
