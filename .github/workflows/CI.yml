name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.10"   # LTS
          - "1"      # latest stable
          - "nightly"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        exclude:
          - os: macos-latest
            version: nightly
          - os: windows-latest
            version: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # ClusterAlgebras.jl and Resurgence.jl are not in the General registry, so Pkg
      # cannot resolve them by name. Check them out and `develop` them by path.
      - uses: actions/checkout@v4
        with:
          repository: benedikt-nagler/ClusterAlgebras.jl
          path: deps/ClusterAlgebras.jl
      - uses: actions/checkout@v4
        with:
          repository: benedikt-nagler/Resurgence.jl
          path: deps/Resurgence.jl
      - name: Develop unregistered dependencies
        run: |
          julia -e '
            using Pkg
            siblings = [PackageSpec(path = "deps/ClusterAlgebras.jl"),
                        PackageSpec(path = "deps/Resurgence.jl")]
            Pkg.activate(".")
            Pkg.develop(siblings)
            # test/Project.toml also lists ExactWKB itself, which is equally
            # unregistered, so the test environment needs all three by path.
            Pkg.activate("test")
            Pkg.develop([siblings; PackageSpec(path = ".")])'
        shell: bash
      - uses: julia-actions/julia-buildpkg@v1
      # Run the test environment prepared above directly, rather than via
      # `julia-actions/julia-runtest` (`Pkg.test()`), which re-resolves the test
      # environment and would lose the by-path entries for the unregistered deps.
      - name: Run tests
        run: julia --project=test --code-coverage=user test/runtests.jl
        shell: bash
        continue-on-error: ${{ matrix.version == 'nightly' }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
