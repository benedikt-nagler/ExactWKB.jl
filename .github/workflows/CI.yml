name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.10"   # LTS
          - "1"      # latest stable
          - "nightly"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        exclude:
          - os: macos-latest
            version: nightly
          - os: windows-latest
            version: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # ClusterAlgebras.jl and Resurgence.jl resolve from the General registry under the
      # `[compat]` bounds. Only ExactWKB itself is unregistered, and test/Project.toml
      # lists it, so the test environment needs it by path.
      - name: Develop ExactWKB into the test environment
        run: |
          julia -e '
            using Pkg
            Pkg.activate("test")
            Pkg.develop(PackageSpec(path = "."))'
        shell: bash
      - uses: julia-actions/julia-buildpkg@v1
      # Run the test environment prepared above directly, rather than via
      # `julia-actions/julia-runtest` (`Pkg.test()`), which re-resolves the test
      # environment and would lose the by-path entry for ExactWKB itself.
      - name: Run tests
        run: julia --project=test --code-coverage=user test/runtests.jl
        shell: bash
        continue-on-error: ${{ matrix.version == 'nightly' }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
