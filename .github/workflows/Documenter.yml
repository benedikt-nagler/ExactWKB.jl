name: Documenter

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  docs:
    name: Build and deploy documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      # ClusterAlgebras.jl and Resurgence.jl resolve from the General registry under the
      # `[compat]` bounds. Only ExactWKB itself is unregistered, and docs/Project.toml
      # lists it, so the docs environment needs it by path.
      - name: Develop ExactWKB into the docs environment
        run: |
          julia -e '
            using Pkg
            Pkg.activate("docs")
            Pkg.develop(PackageSpec(path = "."))'
        shell: bash
      - uses: julia-actions/julia-buildpkg@v1
      # Not julia-actions/julia-docdeploy, which re-resolves docs/ and would lose the
      # by-path entry for ExactWKB itself.
      - name: Build and deploy
        run: julia --project=docs docs/make.jl
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
